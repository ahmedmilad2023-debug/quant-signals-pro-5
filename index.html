<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quant Signals Pro - محرك إشارات التداول الكمية SMC</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM 18 CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Custom Fonts & Tailwind Configuration -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #0B0F19;
      color: #F3F4F6;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card-hover:hover {
      border-color: rgba(168, 85, 247, 0.4);
      box-shadow: 0 8px 30px rgba(168, 85, 247, 0.12);
    }
  </style>
</head>
<body class="min-h-screen text-gray-100 antialiased selection:bg-purple-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    const PAIRS = [
      { symbol: 'BTCUSDT', name: 'Bitcoin', icon: '₿' },
      { symbol: 'ETHUSDT', name: 'Ethereum', icon: 'Ξ' },
      { symbol: 'SOLUSDT', name: 'Solana', icon: '◎' },
      { symbol: 'BNBUSDT', name: 'BNB', icon: '🔶' },
      { symbol: 'XRPUSDT', name: 'XRP', icon: '✕' },
      { symbol: 'ADAUSDT', name: 'Cardano', icon: '₳' },
      { symbol: 'DOGEUSDT', name: 'Dogecoin', icon: 'Ð' },
      { symbol: 'AVAXUSDT', name: 'Avalanche', icon: '🔺' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('signals');
      const [selectedPair, setSelectedPair] = useState('BTCUSDT');
      const [marketTickers, setMarketTickers] = useState({});
      const [activeSignals, setActiveSignals] = useState([]);
      const [closedSignals, setClosedSignals] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [lastRefreshed, setLastRefreshed] = useState(new Date().toLocaleTimeString('ar-SA'));

      // Fetch Live Market Prices from Binance Futures API
      const fetchBinancePrices = async () => {
        try {
          const response = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
          if (!response.ok) throw new Error('Network error');
          const data = await response.json();
          
          const tickerMap = {};
          data.forEach(item => {
            if (PAIRS.some(p => p.symbol === item.symbol)) {
              tickerMap[item.symbol] = {
                price: parseFloat(item.lastPrice),
                change24h: parseFloat(item.priceChangePercent),
                high24h: parseFloat(item.highPrice),
                low24h: parseFloat(item.lowPrice),
                volume24h: parseFloat(item.quoteVolume)
              };
            }
          });
          setMarketTickers(tickerMap);
          setLastRefreshed(new Date().toLocaleTimeString('ar-SA'));
        } catch (err) {
          console.warn('Binance API fetch failed', err);
        }
      };

      // Quantitative SMC Analysis Engine
      const analyzeAndGenerateSignals = useCallback(async () => {
        setIsAnalyzing(true);
        try {
          const newSignalsList = [];
          
          for (const pairObj of PAIRS) {
            const pair = pairObj.symbol;
            try {
              const res = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${pair}&interval=15m&limit=50`);
              if (!res.ok) continue;
              const klines = await res.json();
              if (!klines || klines.length < 30) continue;
              
              const closes = klines.map(k => parseFloat(k[4]));
              const highs = klines.map(k => parseFloat(k[2]));
              const lows = klines.map(k => parseFloat(k[3]));
              const currentPrice = closes[closes.length - 1];

              // HTF Trend Bias Calculation (20 EMA vs 50 EMA)
              const sum20 = closes.slice(-20).reduce((a, b) => a + b, 0) / 20;
              const sum50 = closes.slice(-50).reduce((a, b) => a + b, 0) / 50;
              const htfBias = sum20 > sum50 ? 'BULLISH' : 'BEARISH';

              const lastCandleChange = ((closes[closes.length - 1] - closes[closes.length - 2]) / closes[closes.length - 2]) * 100;
              let action = null;
              
              if (htfBias === 'BULLISH' && lastCandleChange > 0.15) {
                action = 'BUY';
              } else if (htfBias === 'BEARISH' && lastCandleChange < -0.15) {
                action = 'SELL';
              }

              // Apply User Strict HTF Bias Filter
              if (action === 'BUY' && htfBias !== 'BULLISH') continue;
              if (action === 'SELL' && htfBias !== 'BEARISH') continue;

              if (action) {
                const atr = (Math.max(...highs.slice(-10)) - Math.min(...lows.slice(-10))) / 10;
                const sl = action === 'BUY' ? currentPrice - (atr * 1.5) : currentPrice + (atr * 1.5);
                const tp1 = action === 'BUY' ? currentPrice + (atr * 1.8) : currentPrice - (atr * 1.8);
                const tp2 = action === 'BUY' ? currentPrice + (atr * 3.2) : currentPrice - (atr * 3.2);

                const newSig = {
                  id: `sig_${pair.toLowerCase()}_${Date.now()}`,
                  symbol: pair,
                  action: action,
                  entryPrice: currentPrice,
                  sl: sl,
                  tp1: tp1,
                  tp2: tp2,
                  timeframe: '15m',
                  htfBias: htfBias,
                  confidenceScore: Math.floor(Math.random() * 10) + 88,
                  smcConfluences: [
                    action === 'BUY' ? 'Bullish Order Block (OB)' : 'Bearish Order Block (OB)',
                    'Fair Value Gap (FVG)',
                    `تطابق مع الاتجاه العام (${htfBias})`
                  ],
                  createdAt: new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' })
                };
                newSignalsList.push(newSig);
              }
            } catch (e) {
              console.error(e);
            }
          }

          if (newSignalsList.length > 0) {
            setActiveSignals(prev => {
              let updatedActive = [...prev];
              let updatedClosed = [];

              newSignalsList.forEach(newSig => {
                const existingIndex = updatedActive.findIndex(s => s.symbol === newSig.symbol);
                if (existingIndex !== -1) {
                  const cancelledSig = updatedActive.splice(existingIndex, 1)[0];
                  updatedClosed.push({
                    ...cancelledSig,
                    status: 'CANCELLED',
                    closeReason: 'Opposite Signal Generated'
                  });
                }
                updatedActive.unshift(newSig);
              });

              if (updatedClosed.length > 0) {
                setClosedSignals(c => [...updatedClosed, ...c]);
              }
              return updatedActive.slice(0, 6);
            });
          }
        } finally {
          setIsAnalyzing(false);
          setIsLoading(false);
        }
      }, []);

      useEffect(() => {
        fetchBinancePrices();
        analyzeAndGenerateSignals();
        const interval = setInterval(fetchBinancePrices, 10000);
        return () => clearInterval(interval);
      }, [analyzeAndGenerateSignals]);

      return (
        <div className="min-h-screen pb-16">
          <header className="border-b border-gray-800 bg-gray-950/80 sticky top-0 z-50 backdrop-blur-md">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center font-black text-white text-xl shadow-lg shadow-purple-500/20">Q</div>
                <div>
                  <h1 className="text-xl font-bold bg-gradient-to-r from-white via-purple-200 to-purple-400 bg-clip-text text-transparent">Quant Signals Pro</h1>
                  <p className="text-xs text-gray-400">محرك إشارات التداول الكمية SMC</p>
                </div>
              </div>

              <button 
                onClick={() => { fetchBinancePrices(); analyzeAndGenerateSignals(); }}
                disabled={isAnalyzing}
                className="px-4 py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs sm:text-sm shadow-lg shadow-purple-600/30 disabled:opacity-50"
              >
                {isAnalyzing ? 'جاري الفحص...' : '🔄 فحص السوق المباشر'}
              </button>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 pt-6 space-y-6">
            <div className="flex items-center justify-between border-b border-gray-800 pb-3">
              <div className="flex gap-2">
                <button onClick={() => setActiveTab('signals')} className={`px-4 py-2 rounded-lg font-bold text-sm ${activeTab === 'signals' ? 'bg-purple-600/20 text-purple-400 border border-purple-500/30' : 'text-gray-400'}`}>
                  الإشارات النشطة ({activeSignals.length})
                </button>
                <button onClick={() => setActiveTab('market')} className={`px-4 py-2 rounded-lg font-bold text-sm ${activeTab === 'market' ? 'bg-purple-600/20 text-purple-400 border border-purple-500/30' : 'text-gray-400'}`}>
                  أسعار Binance الحية
                </button>
              </div>
              <span className="text-xs text-gray-400">تحديث تلقائي: {lastRefreshed}</span>
            </div>

            {activeTab === 'signals' && (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                {activeSignals.map(sig => (
                  <div key={sig.id} className="glass-card glass-card-hover rounded-2xl p-5 space-y-4">
                    <div className="flex items-center justify-between">
                      <span className={`px-3 py-1 rounded-lg text-xs font-black ${sig.action === 'BUY' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}`}>
                        {sig.action === 'BUY' ? '🟢 BUY / LONG' : '🔴 SELL / SHORT'}
                      </span>
                      <span className="text-base font-bold text-white">{sig.symbol}</span>
                      <span className="text-xs bg-purple-500/10 text-purple-300 px-2 py-1 rounded font-bold">{sig.confidenceScore}%</span>
                    </div>

                    <div className="grid grid-cols-2 gap-2 text-xs bg-gray-900/80 p-3 rounded-xl border border-gray-800">
                      <div><span className="text-gray-400 block">سعر الدخول:</span><span className="font-mono font-bold text-white">{sig.entryPrice?.toFixed(4)}</span></div>
                      <div><span className="text-gray-400 block">السعر الحالي:</span><span className="font-mono font-bold text-purple-300">{(marketTickers[sig.symbol]?.price || sig.entryPrice)?.toFixed(4)}</span></div>
                    </div>

                    <div className="space-y-1.5 text-xs">
                      <div className="flex justify-between p-2 rounded bg-emerald-950/30 text-emerald-400 font-bold"><span>الهدف TP1:</span><span>{sig.tp1?.toFixed(4)}</span></div>
                      <div className="flex justify-between p-2 rounded bg-red-950/30 text-red-400 font-bold"><span>الوقف SL:</span><span>{sig.sl?.toFixed(4)}</span></div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'market' && (
              <div className="glass-card rounded-2xl overflow-hidden">
                <table className="w-full text-right text-sm">
                  <thead className="bg-gray-900 text-gray-400 text-xs p-3">
                    <tr><th className="p-3">الزوج</th><th className="p-3">السعر</th><th className="p-3">التغير 24h</th></tr>
                  </thead>
                  <tbody className="divide-y divide-gray-800 font-mono">
                    {PAIRS.map(p => {
                      const t = marketTickers[p.symbol];
                      if (!t) return null;
                      return (
                        <tr key={p.symbol}>
                          <td className="p-3 font-bold text-white">{p.symbol}</td>
                          <td className="p-3 text-purple-300">${t.price?.toFixed(4)}</td>
                          <td className={`p-3 font-bold ${t.change24h >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>{t.change24h?.toFixed(2)}%</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
