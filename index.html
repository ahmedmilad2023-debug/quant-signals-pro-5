/* =========================================================

const STORAGE_KEYS = {

};


function loadStorage(key, fallback) {
    try {
        const value = localStorage.getItem(key);

        if (!value) {
            return fallback;
        }

        return JSON.parse(value);
    } catch (error) {
        console.warn('Storage read error:', error);
        return fallback;
    }
}


function saveStorage(key, value) {
    try {
        localStorage.setItem(key, JSON.stringify(value));
    } catch (error) {
        console.warn('Storage write error:', error);
    }
}


/* =========================================================
   NUMBER HELPERS
========================================================= */

function roundTo(value, precision = 2) {
    if (!Number.isFinite(value)) {
        return 0;
    }

    return Number(value.toFixed(precision));
}


function safeNumber(value, fallback = 0) {
    const number = Number(value);

    return Number.isFinite(number)
        ? number
        : fallback;
}


/* =========================================================
   INDICATORS
========================================================= */

function calculateSMA(values, period) {
    if (!Array.isArray(values) || values.length < period) {
        return null;
    }

    const slice = values.slice(-period);

    return slice.reduce((sum, value) => sum + value, 0) / period;
}


function calculateEMA(values, period) {
    if (!Array.isArray(values) || values.length < period) {
        return null;
    }

    const multiplier = 2 / (period + 1);

    let ema = calculateSMA(values.slice(0, period), period);

    if (ema === null) {
        return null;
    }

    for (let i = period; i < values.length; i++) {
        ema = (
            (values[i] - ema) * multiplier
        ) + ema;
    }

    return ema;
}


function calculateATR(candles, period = 14) {
    if (!Array.isArray(candles) || candles.length < period + 1) {
        return null;
    }

    const trueRanges = [];

    for (let i = 1; i < candles.length; i++) {

        const current = candles[i];
        const previous = candles[i - 1];

        const high = current.high;
        const low = current.low;
        const previousClose = previous.close;

        const tr = Math.max(
            high - low,
            Math.abs(high - previousClose),
            Math.abs(low - previousClose)
        );

        trueRanges.push(tr);
    }

    if (trueRanges.length < period) {
        return null;
    }

    return calculateSMA(trueRanges, period);
}


function calculateRSI(closes, period = 14) {
    if (!Array.isArray(closes) || closes.length < period + 1) {
        return null;
    }

    let gains = 0;
    let losses = 0;

    for (let i = 1; i <= period; i++) {

        const change = closes[i] - closes[i - 1];

        if (change >= 0) {
            gains += change;
        } else {
            losses += Math.abs(change);
        }
    }

    let averageGain = gains / period;
    let averageLoss = losses / period;

    for (let i = period + 1; i < closes.length; i++) {

        const change = closes[i] - closes[i - 1];

        const gain = change > 0 ? change : 0;
        const loss = change < 0 ? Math.abs(change) : 0;

        averageGain = (
            (averageGain * (period - 1)) + gain
        ) / period;

        averageLoss = (
            (averageLoss * (period - 1)) + loss
        ) / period;
    }

    if (averageLoss === 0) {
        return 100;
    }

    const rs = averageGain / averageLoss;

    return 100 - (100 / (1 + rs));
}


function calculateVolumeSMA(candles, period = 20) {
    if (!Array.isArray(candles) || candles.length < period) {
        return null;
    }

    const volumes = candles
        .slice(-period)
        .map(candle => candle.volume);

    return calculateSMA(volumes, period);
}


/* =========================================================
   MARKET STRUCTURE
========================================================= */

function findRecentSwingHigh(candles, lookback = 10) {

    if (candles.length < lookback * 2 + 1) {
        return null;
    }

    const start = Math.max(
        1,
        candles.length - lookback - 6
    );

    const end = candles.length - 1;

    let swing = null;

    for (let i = start; i < end; i++) {

        const left = candles[i - 1];
        const current = candles[i];
        const right = candles[i + 1];

        if (
            current.high > left.high &&
            current.high > right.high
        ) {
            if (!swing || current.high > swing.price) {
                swing = {
                    index: i,
                    price: current.high
                };
            }
        }
    }

    return swing;
}


function findRecentSwingLow(candles, lookback = 10) {

    if (candles.length < lookback * 2 + 1) {
        return null;
    }

    const start = Math.max(
        1,
        candles.length - lookback - 6
    );

    const end = candles.length - 1;

    let swing = null;

    for (let i = start; i < end; i++) {

        const left = candles[i - 1];
        const current = candles[i];
        const right = candles[i + 1];

        if (
            current.low < left.low &&
            current.low < right.low
        ) {
            if (!swing || current.low < swing.price) {
                swing = {
                    index: i,
                    price: current.low
                };
            }
        }
    }

    return swing;
}


/* =========================================================
   FVG DETECTION
========================================================= */

function detectFVG(candles) {

    if (candles.length < 5) {
        return {
            bullish: false,
            bearish: false,
            zone: null
        };
    }

    const a = candles[candles.length - 3];
    const b = candles[candles.length - 2];
    const c = candles[candles.length - 1];

    if (a.high < c.low) {

        return {
            bullish: true,
            bearish: false,
            zone: {
                low: a.high,
                high: c.low,
                candleTime: b.closeTime
            }
        };
    }

    if (a.low > c.high) {

        return {
            bullish: false,
            bearish: true,
            zone: {
                low: c.high,
                high: a.low,
                candleTime: b.closeTime
            }
        };
    }

    return {
        bullish: false,
        bearish: false,
        zone: null
    };
}


/* =========================================================
   LIQUIDITY SWEEP
========================================================= */

function detectLiquiditySweep(candles) {

    if (candles.length < 15) {
        return {
            bullish: false,
            bearish: false
        };
    }

    const recent = candles.slice(
        candles.length - 8,
        candles.length - 1
    );

    const previousLow = Math.min(
        ...recent.map(c => c.low)
    );

    const previousHigh = Math.max(
        ...recent.map(c => c.high)
    );

    const last = candles[candles.length - 1];

    const bullishSweep =
        last.low < previousLow &&
        last.close > previousLow;

    const bearishSweep =
        last.high > previousHigh &&
        last.close < previousHigh;

    return {
        bullish: bullishSweep,
        bearish: bearishSweep
    };
}


/* =========================================================
   ORDER BLOCK
========================================================= */

function detectOrderBlock(candles, direction) {

    if (candles.length < 8) {
        return null;
    }

    const start = Math.max(
        1,
        candles.length - 8
    );

    for (let i = candles.length - 2; i >= start; i--) {

        const candle = candles[i];

        if (direction === 'BUY') {

            if (candle.close < candle.open) {

                const next = candles[i + 1];

                if (next.close > candle.high) {

                    return {
                        index: i,
                        low: candle.low,
                        high: candle.high
                    };
                }
            }
        }

        if (direction === 'SELL') {

            if (candle.close > candle.open) {

                const next = candles[i + 1];

                if (next.close < candle.low) {

                    return {
                        index: i,
                        low: candle.low,
                        high: candle.high
                    };
                }
            }
        }
    }

    return null;
}


/* =========================================================
   SIGNAL ANALYSIS
========================================================= */

function analyzeMarket(
    candles,
    higherTimeframeCandles,
    pairObj,
    settings
) {

    if (
        !candles ||
        candles.length < 60 ||
        !higherTimeframeCandles ||
        higherTimeframeCandles.length < 60
    ) {
        return null;
    }

    /*
       IMPORTANT:
       We intentionally use the last CLOSED candle.
       The current live candle is not used to create a signal.
    */

    const closedCandles = candles.slice(0, -1);

    if (closedCandles.length < 50) {
        return null;
    }

    const closes = closedCandles.map(c => c.close);

    const current = closedCandles[closedCandles.length - 1];

    const currentPrice = current.close;

    const ema20 = calculateEMA(closes, 20);
    const ema50 = calculateEMA(closes, 50);

    const htfCloses = higherTimeframeCandles
        .slice(0, -1)
        .map(c => c.close);

    const htfEma20 = calculateEMA(htfCloses, 20);
    const htfEma50 = calculateEMA(htfCloses, 50);

    const atr = calculateATR(closedCandles, 14);

    const rsi = calculateRSI(closes, 14);

    const volumeAverage = calculateVolumeSMA(
        closedCandles,
        20
    );

    if (
        ema20 === null ||
        ema50 === null ||
        htfEma20 === null ||
        htfEma50 === null ||
        atr === null ||
        rsi === null ||
        volumeAverage === null
    ) {
        return null;
    }

    const htfBullish =
        htfEma20 > htfEma50;

    const htfBearish =
        htfEma20 < htfEma50;

    const localBullish =
        ema20 > ema50;

    const localBearish =
        ema20 < ema50;

    const previousClose =
        closes[closes.length - 3];

    const momentumPct =
        previousClose !== 0
            ? (
                (currentPrice - previousClose) /
                previousClose
            ) * 100
            : 0;

    const volumeExpansion =
        current.volume >
        volumeAverage * 1.15;

    const fvg = detectFVG(closedCandles);

    const liquidity =
        detectLiquiditySweep(closedCandles);

    const bullishOB =
        detectOrderBlock(
            closedCandles,
            'BUY'
        );

    const bearishOB =
        detectOrderBlock(
            closedCandles,
            'SELL'
        );

    let buyScore = 0;
    let sellScore = 0;

    const buyReasons = [];
    const sellReasons = [];


    /* HTF */

    if (htfBullish) {
        buyScore += 25;
        buyReasons.push(
            'اتجاه 1H صاعد'
        );
    }

    if (htfBearish) {
        sellScore += 25;
        sellReasons.push(
            'اتجاه 1H هابط'
        );
    }


    /* Local trend */

    if (localBullish) {
        buyScore += 15;
        buyReasons.push(
            'EMA20 أعلى من EMA50'
        );
    }

    if (localBearish) {
        sellScore += 15;
        sellReasons.push(
            'EMA20 أسفل EMA50'
        );
    }


    /* Momentum */

    if (momentumPct > 0.10) {
        buyScore += 10;
        buyReasons.push(
            'زخم سعري إيجابي'
        );
    }

    if (momentumPct < -0.10) {
        sellScore += 10;
        sellReasons.push(
            'زخم سعري سلبي'
        );
    }


    /* RSI */

    if (rsi >= 50 && rsi <= 70) {
        buyScore += 10;
        buyReasons.push(
            'RSI يدعم الشراء'
        );
    }

    if (rsi <= 50 && rsi >= 30) {
        sellScore += 10;
        sellReasons.push(
            'RSI يدعم البيع'
        );
    }


    /* Volume */

    if (volumeExpansion) {

        if (momentumPct > 0) {
            buyScore += 10;
            buyReasons.push(
                'ارتفاع مؤكد في الحجم'
            );
        }

        if (momentumPct < 0) {
            sellScore += 10;
            sellReasons.push(
                'ارتفاع مؤكد في الحجم'
            );
        }
    }


    /* Liquidity */

    if (liquidity.bullish) {

        buyScore += 15;

        buyReasons.push(
            'Liquidity Sweep صاعد'
        );
    }

    if (liquidity.bearish) {

        sellScore += 15;

        sellReasons.push(
            'Liquidity Sweep هابط'
        );
    }


    /* FVG */

    if (fvg.bullish) {

        buyScore += 10;

        buyReasons.push(
            'Bullish Fair Value Gap'
        );
    }

    if (fvg.bearish) {

        sellScore += 10;

        sellReasons.push(
            'Bearish Fair Value Gap'
        );
    }


    /* Order Block */

    if (
        bullishOB &&
        currentPrice >= bullishOB.low &&
        currentPrice <= bullishOB.high * 1.003
    ) {

        buyScore += 15;

        buyReasons.push(
            'Bullish Order Block'
        );
    }

    if (
        bearishOB &&
        currentPrice <= bearishOB.high &&
        currentPrice >= bearishOB.low * 0.997
    ) {

        sellScore += 15;

        sellReasons.push(
            'Bearish Order Block'
        );
    }


    let action = null;
    let score = 0;
    let reasons = [];

    if (
        buyScore >= sellScore &&
        buyScore >= settings.minConfidence &&
        htfBullish
    ) {

        action = 'BUY';
        score = buyScore;
        reasons = buyReasons;
    }

    if (
        sellScore > buyScore &&
        sellScore >= settings.minConfidence &&
        htfBearish
    ) {

        action = 'SELL';
        score = sellScore;
        reasons = sellReasons;
    }


    if (!action) {
        return null;
    }


    /*
       Dynamic ATR risk.

       SL = 1.5 ATR
       TP = actual configured R:R.
    */

    const stopDistance = atr * 1.5;

    if (
        !Number.isFinite(stopDistance) ||
        stopDistance <= 0
    ) {
        return null;
    }

    let sl;
    let tp1;
    let tp2;
    let tp3;

    if (action === 'BUY') {

        sl =
            currentPrice -
            stopDistance;

        tp1 =
            currentPrice +
            stopDistance *
            settings.riskRewardRatio *
            0.50;

        tp2 =
            currentPrice +
            stopDistance *
            settings.riskRewardRatio *
            0.75;

        tp3 =
            currentPrice +
            stopDistance *
            settings.riskRewardRatio;
    } else {

        sl =
            currentPrice +
            stopDistance;

        tp1 =
            currentPrice -
            stopDistance *
            settings.riskRewardRatio *
            0.50;

        tp2 =
            currentPrice -
            stopDistance *
            settings.riskRewardRatio *
            0.75;

        tp3 =
            currentPrice -
            stopDistance *
            settings.riskRewardRatio;
    }


    const timestamp =
        new Date(current.closeTime).toISOString();

    const createdAt =
        new Date(current.closeTime)
            .toLocaleString(
                'ar-LY',
                {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                }
            );

    return {

        id:
            `sig_${pairObj.symbol.toLowerCase()}_${current.closeTime}`,

        symbol:
            pairObj.symbol,

        pair:
            pairObj.symbol,

        action,
        type: action,
        direction: action,

        status: 'ACTIVE',

        entryPrice:
            currentPrice,

        sl,
        tp1,
        tp2,
        tp3,

        timeframe:
            settings.timeframe,

        higherTimeframe:
            settings.higherTimeframe,

        htfBias:
            htfBullish
                ? 'BULLISH'
                : 'BEARISH',

        confidenceScore:
            Math.min(
                100,
                Math.max(
                    0,
                    Math.round(score)
                )
            ),

        precision:
            pairObj.precision,

        atr,

        rsi,

        volumeExpansion,

        smcConfluences:
            reasons,

        timestamp,

        createdAt,

        sourceCandleTime:
            current.closeTime,

        lastUpdated:
            Date.now()
    };
}


/* =========================================================
   APP
========================================================= */

function App() {

    const [activeTab, setActiveTab] =
        useState('signals');

    const [selectedPair, setSelectedPair] =
        useState('BTCUSDT');

    const [marketTickers, setMarketTickers] =
        useState({});

    const [activeSignals, setActiveSignals] =
        useState(() =>
            loadStorage(
                STORAGE_KEYS.ACTIVE,
                []
            )
        );

    const [closedSignals, setClosedSignals] =
        useState(() =>
            loadStorage(
                STORAGE_KEYS.CLOSED,
                []
            )
        );

    const [settings, setSettings] =
        useState(() =>
            loadStorage(
                STORAGE_KEYS.SETTINGS,
                INITIAL_SETTINGS
            )
        );

    const [isLoading, setIsLoading] =
        useState(true);

    const [isAnalyzing, setIsAnalyzing] =
        useState(false);

    const [lastRefreshed, setLastRefreshed] =
        useState('');

    const [showSettings, setShowSettings] =
        useState(false);

    const [errorMessage, setErrorMessage] =
        useState('');

    const audioRef =
        useRef(null);

    const lastSignalCandleRef =
        useRef({});


    /* =====================================================
       SAVE LOCAL STATE
    ===================================================== */

    useEffect(() => {
        saveStorage(
            STORAGE_KEYS.ACTIVE,
            activeSignals
        );
    }, [activeSignals]);


    useEffect(() => {
        saveStorage(
            STORAGE_KEYS.CLOSED,
            closedSignals
        );
    }, [closedSignals]);


    useEffect(() => {
        saveStorage(
            STORAGE_KEYS.SETTINGS,
            settings
        );
    }, [settings]);


    /* =====================================================
       FETCH TICKERS
    ===================================================== */

    const fetchBinancePrices =
        useCallback(async () => {

            try {

                setErrorMessage('');

                const response =
                    await fetch(
                        `${BINANCE_FUTURES_API}/fapi/v1/ticker/24hr`,
                        {
                            cache: 'no-store'
                        }
                    );

                if (!response.ok) {
                    throw new Error(
                        `Binance API HTTP ${response.status}`
                    );
                }

                const data =
                    await response.json();

                const allowed =
                    new Set(
                        PAIRS.map(
                            pair => pair.symbol
                        )
                    );

                const tickerMap = {};

                data.forEach(item => {

                    if (!allowed.has(item.symbol)) {
                        return;
                    }

                    tickerMap[item.symbol] = {

                        price:
                            safeNumber(
                                item.lastPrice
                            ),

                        change24h:
                            safeNumber(
                                item.priceChangePercent
                            ),

                        high24h:
                            safeNumber(
                                item.highPrice
                            ),

                        low24h:
                            safeNumber(
                                item.lowPrice
                            ),

                        volume24h:
                            safeNumber(
                                item.quoteVolume
                            ),

                        timestamp:
                            Date.now()
                    };
                });

                setMarketTickers(tickerMap);

                setLastRefreshed(
                    new Date()
                        .toLocaleTimeString(
                            'ar-LY',
                            {
                                hour: '2-digit',
                                minute: '2-digit',
                                second: '2-digit'
                            }
                        )
                );

            } catch (error) {

                console.error(
                    'Binance ticker error:',
                    error
                );

                setErrorMessage(
                    'تعذر تحديث أسعار Binance حالياً'
                );
            }

        }, []);


    /* =====================================================
       FETCH KLINES
    ===================================================== */

    const fetchKlines =
        useCallback(
            async (
                symbol,
                interval,
                limit = 120
            ) => {

                const url =
                    `${BINANCE_FUTURES_API}/fapi/v1/klines` +
                    `?symbol=${encodeURIComponent(symbol)}` +
                    `&interval=${encodeURIComponent(interval)}` +
                    `&limit=${limit}`;

                const response =
                    await fetch(
                        url,
                        {
                            cache: 'no-store'
                        }
                    );

                if (!response.ok) {

                    throw new Error(
                        `Kline HTTP ${response.status}`
                    );
                }

                const data =
                    await response.json();

                return data.map(item => ({

                    openTime:
                        safeNumber(item[0]),

                    open:
                        safeNumber(item[1]),

                    high:
                        safeNumber(item[2]),

                    low:
                        safeNumber(item[3]),

                    close:
                        safeNumber(item[4]),

                    volume:
                        safeNumber(item[5]),

                    closeTime:
                        safeNumber(item[6])
                }));

            },
            []
        );


    /* =====================================================
       CREATE SIGNAL
    ===================================================== */

    const analyzeAndGenerateSignals =
        useCallback(async () => {

            if (isAnalyzing) {
                return;
            }

            setIsAnalyzing(true);

            try {

                const results =
                    await Promise.allSettled(

                        PAIRS.map(
                            async pairObj => {

                                const [
                                    candles,
                                    higherCandles
                                ] = await Promise.all([

                                    fetchKlines(
                                        pairObj.symbol,
                                        settings.timeframe,
                                        120
                                    ),

                                    fetchKlines(
                                        pairObj.symbol,
                                        settings.higherTimeframe,
                                        120
                                    )

                                ]);

                                const signal =
                                    analyzeMarket(
                                        candles,
                                        higherCandles,
                                        pairObj,
                                        settings
                                    );

                                return signal;
                            }
                        )
                    );


                const generatedSignals = [];

                results.forEach(result => {

                    if (
                        result.status === 'fulfilled' &&
                        result.value
                    ) {

                        generatedSignals.push(
                            result.value
                        );
                    }
                });


                if (
                    generatedSignals.length === 0
                ) {

                    return;
                }


                setActiveSignals(previous => {

                    let next =
                        [...previous];

                    const newlyCreated = [];


                    generatedSignals.forEach(signal => {

                        const previousCandle =
                            lastSignalCandleRef.current[
                                signal.symbol
                            ];


                        /*
                           IMPORTANT:
                           Do not create the same signal
                           repeatedly every 30 seconds.
                        */

                        if (
                            previousCandle ===
                            signal.sourceCandleTime
                        ) {
                            return;
                        }


                        lastSignalCandleRef.current[
                            signal.symbol
                        ] =
                            signal.sourceCandleTime;


                        const existingIndex =
                            next.findIndex(
                                item =>
                                    item.symbol ===
                                    signal.symbol
                            );


                        if (
                            existingIndex !== -1
                        ) {

                            const existing =
                                next[existingIndex];


                            /*
                               Do not replace an active
                               signal with the exact same
                               direction.
                            */

                            if (
                                existing.action ===
                                signal.action
                            ) {

                                return;
                            }


                            const cancelled = {

                                ...existing,

                                status:
                                    'CANCELLED',

                                closeReason:
                                    'إشارة معاكسة',

                                closedAt:
                                    new Date()
                                        .toLocaleString(
                                            'ar-LY'
                                        ),

                                closeTimestamp:
                                    Date.now()
                            };


                            setClosedSignals(
                                history => [
                                    cancelled,
                                    ...history
                                ]
                            );


                            next.splice(
                                existingIndex,
                                1
                            );
                        }


                        next.unshift(
                            signal
                        );

                        newlyCreated.push(
                            signal
                        );
                    });


                    return next.slice(0, 8);

                });


                /*
                   Telegram is intentionally not
                   silently called from the browser.

                   A production Telegram system should
                   send through a secure backend.
                */

                if (
                    settings.telegramAlerts &&
                    settings.webhookUrl
                ) {

                    for (
                        const signal
                        of generatedSignals
                    ) {

                        try {

                            await sendWebhook(
                                signal,
                                settings.webhookUrl
                            );

                        } catch (error) {

                            console.warn(
                                'Webhook error:',
                                error
                            );
                        }
                    }
                }

            } catch (error) {

                console.error(
                    'Signal engine error:',
                    error
                );

                setErrorMessage(
                    'حدث خطأ أثناء تحليل السوق'
                );

            } finally {

                setIsAnalyzing(false);
                setIsLoading(false);
            }

        }, [
            fetchKlines,
            settings,
            isAnalyzing
        ]);


    /* =====================================================
       WEBHOOK
    ===================================================== */

    async function sendWebhook(
        signal,
        webhookUrl
    ) {

        /*
           WARNING:
           Do not put secret Telegram Bot Tokens
           inside frontend JavaScript.

           This function only sends to a custom
           backend webhook supplied by the user.
        */

        const payload = {

            event: 'NEW_SIGNAL',

            signal: {

                symbol:
                    signal.symbol,

                action:
                    signal.action,

                entry:
                    signal.entryPrice,

                stopLoss:
                    signal.sl,

                tp1:
                    signal.tp1,

                tp2:
                    signal.tp2,

                tp3:
                    signal.tp3,

                confidence:
                    signal.confidenceScore,

                timeframe:
                    signal.timeframe,

                timestamp:
                    signal.timestamp
            }
        };


        const response =
            await fetch(
                webhookUrl,
                {
                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body:
                        JSON.stringify(payload)
                }
            );


        if (!response.ok) {

            throw new Error(
                `Webhook HTTP ${response.status}`
            );
        }
    }


    /* =====================================================
       CHECK ACTIVE SIGNALS AGAINST REAL PRICE
    ===================================================== */

    useEffect(() => {

        if (
            Object.keys(marketTickers).length === 0
        ) {
            return;
        }

        setActiveSignals(previous => {

            const remaining = [];
            const closed = [];


            previous.forEach(signal => {

                    marketTickers[

                if (!ticker) {

                    remaining.push(signal);
                    return;

                const price =
                    ticker.price;


                let closeReason =
                    null;


                if (
                    signal.action === 'BUY'
                ) {

                    if (
                        price <= signal.sl
                    ) {

                        closeReason =
                            'ضرب وقف الخسارة';

                    } else if (
                        price >= signal.tp3
                    ) {

                        closeReason =
                            'تحقق TP3';

                    } else if (
                        price >= signal.tp2
                    ) {

                        closeReason =
                            'تحقق TP2';

                    } else if (
                        price >= signal.tp1
                    ) {

                        closeReason =
                            'تحقق TP1';
                    }

                } else {

                    if (
                        price >= signal.sl

                            'ضرب وقف الخسارة';

                            'تحقق TP3';

                            'تحقق TP2';

                    } else if (
                        price <= signal.tp1
                    ) {

                        closeReason =
                            'تحقق TP1';
                    }
                }


                if (closeReason) {

                    closed.push({

                        ...signal,

                        status:
                            closeReason ===
                            'ضرب وقف الخسارة'
                                ? 'LOSS'
                                : 'WIN',

            if (closed.length > 0) {

                    history => [
                        ...closed,
                        ...history
                    ].slice(0, 200)

            }


            return remaining;
        });

                                                    </div>


                                                    <div className="flex items-center justify-between p-2.5 rounded-xl bg-emerald-950/20 border border-emerald-900/30">

                                                        <span className="text-emerald-400/70 font-bold">
                                                            🎯 TP3
                                                        </span>

                                                        <span className="font-mono font-bold text-emerald-300 text-sm">
                                                            {signal.tp3.toFixed(
                                                                precision
                                                            )}
                                                        </span>

                                                    </div>


                                                    <div className="flex items-center justify-between p-2.5 rounded-xl bg-red-950/30 border border-red-900/40">

                                                        <span className="text-red-400 font-bold">
                                                            🛑 SL
                                                        </span>

                                                        <span className="font-mono font-bold text-red-300 text-sm">
                                                            {signal.sl.toFixed(
                                                                precision
                                                            )}
                                                        </span>

                                                    </div>

                                                </div>


                                                {/* INDICATORS */}

                                                <div className="grid grid-cols-3 gap-2">

                                                    <div className="bg-gray-900 rounded-lg p-2 text-center">

                                                        <div className="text-[9px] text-gray-500">
                                                            RSI
                                                        </div>

                                                        <div className="text-xs font-mono font-bold text-white">
                                                            {signal.rsi.toFixed(
                                                                1
                                                            )}
                                                        </div>

                                                    </div>


                                                    <div className="bg-gray-900 rounded-lg p-2 text-center">

                                                        <div className="text-[9px] text-gray-500">
                                                            ATR
                                                        </div>

                                                        <div className="text-xs font-mono font-bold text-white">
                                                            {signal.atr.toFixed(
                                                                precision
                                                            )}
                                                        </div>

                                                    </div>


                                                    <div className="bg-gray-900 rounded-lg p-2 text-center">

                                                        <div className="text-[9px] text-gray-500">
                                                            HTF
                                                        </div>

                                                        <div
                                                            className={`text-[10px] font-bold ${
                                                                signal.htfBias === 'BULLISH'
                                                                    ? 'text-emerald-400'
                                                                    : 'text-red-400'
                                                            }`}
                                                        >
                                                            {signal.htfBias}
                                                        </div>

                                                    </div>

                                                </div>


                                                {/* REASONS */}

                                                <div className="space-y-1.5 pt-1">

                                                    <span className="text-[11px] text-gray-400 font-bold block">
                                                        أسباب الإشارة:
                                                    </span>

                                                    <div className="flex flex-wrap gap-1">

                                                        {signal.smcConfluences.map(
                                                            (
                                                                reason,
                                                                index
                                                            ) => (

                                                                <span
                                                                    key={index}
                                                                    className="text-[10px] bg-gray-900 text-gray-300 px-2.5 py-1 rounded-lg border border-gray-800"
                                                                >
                                                                    ✓ {reason}
                                                                </span>

                                                            )
                                                        )}

                                                    </div>

                                                </div>


                                                {/* TIME */}

                                                <div className="flex items-center justify-between text-[10px] text-gray-500 pt-3 border-t border-gray-800/80">

                                                    <span>
                                                        {signal.timeframe}
                                                    </span>

                                                    <span>
                                                        HTF {signal.higherTimeframe}
                                                    </span>

                                                    <span className="text-gray-300">
                                                        {signal.createdAt}
                                                    </span>

                                                </div>

                                            </div>

                                        );

                                    })}

                                </div>

                            )}

                        </div>

                    )}


                    {/* MARKET */}

                    {activeTab === 'market' && (

                        <div className="glass-card rounded-2xl overflow-hidden border border-gray-800">

                            <div className="p-4 bg-gray-900/60 border-b border-gray-800 flex items-center justify-between">

                                <h3 className="font-bold text-white text-base">
                                    Binance Futures USDT-M
                                </h3>

                                <span className="text-xs text-gray-400">
                                    مصدر السعر: Binance Futures
                                </span>

                            </div>


                            <div className="overflow-x-auto">

                                <table className="w-full text-right text-sm">

                                    <thead className="bg-gray-950 text-gray-400 text-xs uppercase border-b border-gray-800">

                                        <tr>

                                            <th className="p-4">
                                                الزوج
                                            </th>

                                            <th className="p-4">
                                                السعر
                                            </th>

                                            <th className="p-4">
                                                24h
                                            </th>

                                            <th className="p-4">
                                                High
                                            </th>

                                            <th className="p-4">
                                                Low
                                            </th>

                                            <th className="p-4">
                                                Volume
                                            </th>

                                        </tr>

                                    </thead>


                                    <tbody className="divide-y divide-gray-800/60 font-mono">

                                        {PAIRS.map(pair => {

                                            const ticker =
                                                marketTickers[
                                                    pair.symbol
                                                ];

                                            if (!ticker) {
                                                return null;
                                            }

                                            const positive =
                                                ticker.change24h >= 0;

                                            return (

                                                <tr
                                                    key={pair.symbol}
                                                    className="hover:bg-gray-800/30 transition"
                                                >

                                                    <td className="p-4 font-sans font-bold text-white">

                                                        <span className="text-lg ml-2">
                                                            {pair.icon}
                                                        </span>

                                                        {pair.symbol}

                                                    </td>


                                                    <td className="p-4 font-bold text-purple-300">

                                                        {ticker.price.toFixed(
                                                            pair.precision
                                                        )}

                                                    </td>


                                                    <td className="p-4">

                                                        <span
                                                            className={`px-2.5 py-1 rounded-lg font-bold text-xs ${
                                                                positive
                                                                    ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'
                                                                    : 'bg-red-500/10 text-red-400 border border-red-500/20'
                                                            }`}
                                                        >

                                                            {positive
                                                                ? '+'
                                                                : ''}

                                                            {ticker.change24h.toFixed(
                                                                2
                                                            )}

                                                            %

                                                        </span>

                                                    </td>


                                                    <td className="p-4 text-gray-300">
                                                        {ticker.high24h.toFixed(
                                                            pair.precision
                                                        )}
                                                    </td>


                                                    <td className="p-4 text-gray-300">
                                                        {ticker.low24h.toFixed(
                                                            pair.precision
                                                        )}
                                                    </td>


                                                    <td className="p-4 text-gray-400">
                                                        {(ticker.volume24h / 1000000).toFixed(
                                                            2
                                                        )}M
                                                    </td>

                                                </tr>

                                            );

                                        })}

                                    </tbody>

                                </table>

                            </div>

                        </div>

                    )}


                    {/* HISTORY */}

                    {activeTab === 'history' && (

                        <div className="glass-card rounded-2xl p-6 space-y-4">

                            <div className="flex items-center justify-between">

                                <h3 className="font-extrabold text-lg text-white">
                                    سجل الصفقات
                                </h3>

                                <span className="text-xs text-gray-400">
                                    {closedSignals.length} سجل
                                </span>

                            </div>


                            {closedSignals.length === 0 ? (

                                <div className="p-8 text-center text-gray-400 text-sm">
                                    لا توجد صفقات محسومة حتى الآن.
                                </div>

                            ) : (

                                <div className="space-y-3">

                                    {closedSignals.map(
                                        (signal, index) => (

                                            <div
                                                key={
                                                    `${signal.id}_${index}`
                                                }
                                                className="flex flex-wrap items-center justify-between p-4 bg-gray-900/80 rounded-xl border border-gray-800 text-xs gap-3"
                                            >

                                                <div className="flex items-center gap-3">

                                                    <span
                                                        className={`px-2.5 py-1 rounded-lg font-black ${
                                                            signal.action === 'BUY'
                                                                ? 'bg-emerald-500/20 text-emerald-400'
                                                                : 'bg-red-500/20 text-red-400'
                                                        }`}
                                                    >
                                                        {signal.action} {signal.symbol}
                                                    </span>


                                                    <span
                                                        className={`px-2.5 py-1 rounded-lg font-bold ${
                                                            signal.status === 'WIN'
                                                                ? 'bg-emerald-950 text-emerald-400'
                                                                : signal.status === 'LOSS'
                                                                    ? 'bg-red-950 text-red-400'
                                                                    : 'bg-gray-800 text-gray-400'
                                                        }`}
                                                    >
                                                        {signal.status}
                                                    </span>

                                                </div>


                                                <div className="text-gray-300">

                                                    {signal.closeReason}

                                                </div>


                                                {signal.closePrice && (

                                                    <div className="font-mono text-gray-400">

                                                        {signal.closePrice.toFixed(
                                                            signal.precision || 2
                                                        )}

                                                    </div>

                                                )}


                                                <div className="text-gray-500">

                                                    {signal.closedAt}

                                                </div>

                                            </div>

                                        )
                                    )}

                                </div>

                            )}

                        </div>

                    )}


                    {/* ENGINE */}

                    {activeTab === 'engine' && (

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">

                            <div className="glass-card rounded-2xl p-6 space-y-5">

                                <h3 className="text-lg font-extrabold text-white">
                                    🧠 حالة محرك التحليل
                                </h3>


                                <div className="space-y-3">

                                    <div className="flex justify-between bg-gray-900 p-3 rounded-xl">

                                        <span className="text-gray-400">
                                            الفريم الرئيسي
                                        </span>

                                        <strong className="text-white">
                                            {settings.timeframe}
                                        </strong>

                                    </div>


                                    <div className="flex justify-between bg-gray-900 p-3 rounded-xl">

                                        <span className="text-gray-400">
                                            HTF
                                        </span>

                                        <strong className="text-purple-300">
                                            {settings.higherTimeframe}
                                        </strong>

                                    </div>


                                    <div className="flex justify-between bg-gray-900 p-3 rounded-xl">

                                        <span className="text-gray-400">
                                            الحد الأدنى للثقة
                                        </span>

                                        <strong className="text-white">
                                            {settings.minConfidence}%
                                        </strong>

                                    </div>


                                    <div className="flex justify-between bg-gray-900 p-3 rounded-xl">

                                        <span className="text-gray-400">
                                            Risk / Reward
                                        </span>

                                        <strong className="text-white">
                                            1 : {settings.riskRewardRatio}
                                        </strong>

                                    </div>


                                    <div className="flex justify-between bg-gray-900 p-3 rounded-xl">

                                        <span className="text-gray-400">
                                            تحديث السعر
                                        </span>

                                        <strong className="text-emerald-400">
                                            {settings.priceInterval / 1000}s
                                        </strong>

                                    </div>


                                    <div className="flex justify-between bg-gray-900 p-3 rounded-xl">

                                        <span className="text-gray-400">
                                            تحليل المحرك
                                        </span>

                                        <strong className="text-purple-300">
                                            {settings.analysisInterval / 1000}s
                                        </strong>

                                    </div>

                                </div>

                            </div>


                            <div className="glass-card rounded-2xl p-6 space-y-5">

                                <h3 className="text-lg font-extrabold text-white">
                                    طبقات التحليل
                                </h3>


                                <div className="grid grid-cols-2 gap-3">

                                    {[
                                        'HTF Trend',
                                        'EMA Structure',
                                        'Momentum',
                                        'RSI',
                                        'Volume',
                                        'Liquidity Sweep',
                                        'FVG',
                                        'Order Block'
                                    ].map(
                                        item => (

                                            <div
                                                key={item}
                                                className="bg-gray-900 border border-gray-800 rounded-xl p-3 text-center text-xs text-gray-300"
                                            >
                                                <span className="text-emerald-400">
                                                    ✓
                                                </span>

                                                <div className="mt-1">
                                                    {item}
                                                </div>

                                            </div>

                                        )
                                    )}

                                </div>

                                <p className="text-xs text-gray-500 leading-6">
                                    هذه النسخة لا تدعي أن كل طبقة وحدها كافية لإصدار صفقة.
                                    يتم جمع النقاط ثم تطبيق فلتر الاتجاه الأعلى قبل إنشاء الإشارة.
                                </p>

                            </div>

                        </div>

                    )}

                </main>

            </div>


            {/* SETTINGS */}

            {showSettings && (

                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">

                    <div className="glass-card rounded-2xl p-6 max-w-md w-full space-y-5 border border-purple-500/30">

                        <div className="flex items-center justify-between border-b border-gray-800 pb-3">

                            <h3 className="font-extrabold text-white text-base">
                                ⚙️ إعدادات المحرك
                            </h3>

                            <button
                                onClick={() =>
                                    setShowSettings(false)
                                }
                                className="text-gray-400 hover:text-white font-bold text-lg"
                            >
                                ✕
                            </button>

                        </div>


                        <div className="space-y-4 text-xs">


                            <div>

                                <label className="text-gray-300 font-bold block mb-1">
                                    المخاطرة لكل صفقة %
                                </label>

                                <input
                                    type="number"
                                    step="0.1"
                                    min="0.1"
                                    max="10"
                                    value={
                                        settings.riskPerTrade
                                    }
                                    onChange={e =>
                                        setSettings({
                                            ...settings,
                                            riskPerTrade:
                                                safeNumber(
                                                    e.target.value,
                                                    1.5
                                                )
                                        })
                                    }
                                    className="w-full bg-gray-900 border border-gray-800 rounded-xl px-3 py-2 text-white font-mono"
                                />

                            </div>


                            <div>

                                <label className="text-gray-300 font-bold block mb-1">
                                    Risk / Reward
                                </label>

                                <input
                                    type="number"
                                    step="0.1"
                                    min="1"
                                    max="10"
                                    value={
                                        settings.riskRewardRatio
                                    }
                                    onChange={e =>
                                        setSettings({
                                            ...settings,
                                            riskRewardRatio:
                                                safeNumber(
                                                    e.target.value,
                                                    2.5
                                                )
                                        })
                                    }
                                    className="w-full bg-gray-900 border border-gray-800 rounded-xl px-3 py-2 text-white font-mono"
                                />

                            </div>


                            <div>

                                <label className="text-gray-300 font-bold block mb-1">
                                    الحد الأدنى للثقة
                                </label>

                                <input
                                    type="number"
                                    min="50"
                                    max="100"
                                    value={
                                        settings.minConfidence
                                    }
                                    onChange={e =>
                                        setSettings({
                                            ...settings,
                                            minConfidence:
                                                Math.min(
                                                    100,
                                                    Math.max(
                                                        50,
                                                        parseInt(
                                                            e.target.value
                                                        ) || 80
                                                    )
                                                )
                                        })
                                    }
                                    className="w-full bg-gray-900 border border-gray-800 rounded-xl px-3 py-2 text-white font-mono"
                                />

                            </div>


                            <div>

                                <label className="text-gray-300 font-bold block mb-1">
                                    الفريم الرئيسي
                                </label>

                                <select
                                    value={
                                        settings.timeframe
                                    }
                                    onChange={e =>
                                        setSettings({
                                            ...settings,
                                            timeframe:
                                                e.target.value
                                        })
                                    }
                                    className="w-full bg-gray-900 border border-gray-800 rounded-xl px-3 py-2 text-white"
                                >

                                    <option value="15m">
                                        15 دقيقة
                                    </option>

                                    <option value="30m">
                                        30 دقيقة
                                    </option>

                                    <option value="1h">
                                        ساعة
                                    </option>

                                </select>

                            </div>


                            <div>

                                <label className="text-gray-300 font-bold block mb-1">
                                    فريم الاتجاه الأعلى
                                </label>

                                <select
                                    value={
                                        settings.higherTimeframe
                                    }
                                    onChange={e =>
                                        setSettings({
                                            ...settings,
                                            higherTimeframe:
                                                e.target.value
                                        })
                                    }
                                    className="w-full bg-gray-900 border border-gray-800 rounded-xl px-3 py-2 text-white"
                                >

                                    <option value="1h">
                                        1 ساعة
                                    </option>

                                    <option value="4h">
                                        4 ساعات
                                    </option>

                                </select>

                            </div>


                            <div className="flex items-center justify-between p-3 bg-gray-900 rounded-xl border border-gray-800">

                                <span className="font-bold text-gray-200">
                                    تنبيهات Webhook
                                </span>

                                <input
                                    type="checkbox"
                                    checked={
                                        settings.telegramAlerts
                                    }
                                    onChange={e =>
                                        setSettings({
                                            ...settings,
                                            telegramAlerts:
                                                e.target.checked
                                        })
                                    }
                                    className="w-4 h-4 accent-purple-600"
                                />

                            </div>


                            <div>

                                <label className="text-gray-300 font-bold block mb-1">
                                    Webhook URL
                                </label>

                                <input
                                    type="url"
                                    value={
                                        settings.webhookUrl
                                    }
                                    onChange={e =>
                                        setSettings({
                                            ...settings,
                                            webhookUrl:
                                                e.target.value
                                        })
                                    }
                                    placeholder="https://your-backend.com/webhook"
                                    className="w-full bg-gray-900 border border-gray-800 rounded-xl px-3 py-2 text-white font-mono text-xs"
                                />

                            </div>

                        </div>


                        <button
                            onClick={() => {

                                saveStorage(
                                    STORAGE_KEYS.SETTINGS,
                                    settings
                                );

                                setShowSettings(
                                    false
                                );

                            }}
                            className="w-full py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 font-bold text-white transition shadow-lg shadow-purple-600/30"
                        >
                            حفظ التفضيلات
                        </button>

                    </div>

                </div>

            )}


            <footer className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 text-center text-xs text-gray-500 border-t border-gray-900 mt-10">

                <p>
                    © 2026 Quant Signals Pro
                    — محرك تحليل سوق متعدد الطبقات
                </p>

                <p className="mt-2 text-gray-600">
                    الأسعار من Binance Futures. الإشارات تحليلية وليست ضمانًا للربح.
                </p>

            </footer>

        </div>

    );
}


ReactDOM
    .createRoot(
        document.getElementById('root')
    )
    .render(
        <App />
    );

</script>

</body>
  </html>
